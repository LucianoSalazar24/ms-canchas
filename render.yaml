# Blueprint de Render para api-canchas.
# En Render: New → Blueprint → seleccionar este repo. Luego completar en el dashboard
# las variables marcadas con sync:false.
services:
  - type: web
    name: api-canchas
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: node dist/main
    healthCheckPath: /canchas
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      # Connection string del Session Pooler de Supabase (IPv4, puerto 5432)
      - key: DATABASE_URL
        sync: false
